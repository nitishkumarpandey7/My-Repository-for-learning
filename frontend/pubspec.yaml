name: lifeos_x
description: AI-powered life operating system for habits, productivity, finance, study, fitness, and coaching.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.1.0
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.5
  fl_chart: ^1.1.1
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  lottie: ^3.3.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  table_calendar: ^3.2.0
  uuid: ^4.5.2
  flutter_local_notifications: ^22.0.0-dev.3
  timezone: ^0.11.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/rive/
